name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 노드 설치 (Node.js 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 설치
        run: npm install

      - name: 프로젝트 빌드
        run: npm run build

      - name: Git 설정
        # 배포할 때만 필요한 설정이지만, 가독성을 위해 배포 직전에 둡니다.
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 프로젝트 배포
        # ★ 핵심: 오직 main 브랜치에 push(머지 포함)될 때만 실행됩니다.
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.MY_DEPLOY_TOKEN }}
        run: npm run deploy
